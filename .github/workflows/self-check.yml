name: self-check

# The claims in this repository's README are measured numbers. This workflow
# re-measures the ones that do not depend on a developer's machine, so a
# change that quietly makes one of them false fails here rather than being
# discovered by a reader.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, off the hour so it is not in the burst
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    name: the documented numbers still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: the exit-code contract is still 0 / 1 / 2
        run: |
          python - <<'PY'
          from alibi.cli import EXIT_CANNOT_RUN, EXIT_CONTRADICTED, EXIT_OK
          assert (EXIT_OK, EXIT_CONTRADICTED, EXIT_CANNOT_RUN) == (0, 1, 2), \
              "the documented exit codes changed"
          print("exit codes unchanged: 0 / 1 / 2")
          PY

      - name: the self-audit still catches its planted lie
        run: |
          out=$(bash docs/self_audit.sh)
          echo "$out"
          grep -q "CONTRADICTED" <<< "$out" || { echo "::error::the self-audit no longer catches the planted claim"; exit 1; }
          grep -q "exit code: 1" <<< "$out" || { echo "::error::the self-audit no longer exits 1"; exit 1; }
          grep -q "UNVERIFIED" <<< "$out" || { echo "::error::the third verdict disappeared from the demo"; exit 1; }
          echo "the planted claim is still caught, and UNVERIFIED is still not a pass"

      - name: the verdict split accounts for every claim
        # A GitHub runner has nobody's agent transcripts, so `alibi scan` finds
        # nothing there and the published 736-session figures cannot be
        # re-derived in CI. The first two attempts at this step failed for two
        # different reasons: once on an empty JSON document, once because the
        # capture groups of the counting regex were read in the wrong order.
        # So it counts the verdicts of a transcript the repo builds itself,
        # which is the property that can be checked anywhere.
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          out = subprocess.run(
              ["bash", "docs/self_audit.sh"], capture_output=True, text=True, check=True
          ).stdout

          # "2 verified   ✗ 1 contradicted   ? 1 unverified" -> {"verified": 2, ...}
          found = {name: int(n) for n, name in re.findall(r"(\d+) (verified|contradicted|unverified)", out)}
          total = sum(found.values())
          assert total > 0, f"the self-audit produced no verdicts: {found}"
          assert "CONTRADICTED" in out, "no contradicted claim in the demo"
          assert found.get("contradicted", 0) >= 1, "the planted claim was not caught"
          print(f"verdict split accounts for all {total} claims: {found}")
          PY
